name: Refresh official Istanbul market data

on:
  push:
    branches: [main]
    paths-ignore:
      - data/istanbul-markets.json
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: street-bazaars-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh official Istanbul market snapshot
        run: |
          if npm run data:sync:istanbul; then
            echo "Official market data refreshed."
          elif [ -s data/istanbul-markets.json ]; then
            echo "::warning::Official source unavailable; retaining the last known snapshot."
          else
            echo "::error::No local market snapshot and official source is unavailable."
            exit 1
          fi
      - name: Commit snapshot when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/istanbul-markets.json
          if git diff --cached --quiet; then
            echo "Official market snapshot has no changes."
          else
            git commit -m "chore(data): refresh official Istanbul market snapshot"
            git push origin HEAD:main
          fi
