<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101b16" />
    <title>Çevrimdışısın · Street Bazaars</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #101b16;
        color: #f4f7f3;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 520px;
        padding: 32px;
        border: 1px solid #2a4436;
        border-radius: 24px;
        background: #15241c;
      }
      h1 {
        font-size: clamp(1.8rem, 5vw, 2.7rem);
        margin: 0.4rem 0;
        color: #9ee6b6;
      }
      p {
        line-height: 1.7;
        color: #c5d1c8;
      }
      a {
        color: #9ee6b6;
      }
    </style>
  </head>
  <body>
    <main>
      <p>STREET BAZAARS · ÇEVRİMDIŞI MOD</p>
      <h1>Bağlantı şu an yok.</h1>
      <p>
        Daha önce açtığın sayfa ve önbelleğe alınmış arayüz kullanılabilir. Güncel pazar ve fiyat
        verileri bağlantı yeniden kurulana kadar yenilenemez.
      </p>
      <a href="/">Tekrar dene</a>
    </main>
  </body>
</html>
